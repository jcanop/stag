[package]
name = "stag"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11"
anyhow = "1.0.104"
argon2 = "0.6"
clap = { version = "4.6.7", features = ["derive"] }
image = "0.25"
log = "0.4"
pretty_env_logger = "0.5"
rand = "0.10.3"
ratatui = { version = "0.30.2", features = ["crossterm"] }
ratatui-core = "0.1.2"
ratatui-crossterm = "0.1.2"
ratatui-textarea = { version = "0.9.2", features = ["crossterm"] }
ratatui-widgets = "0.3.2"
thiserror = "2"
xxhash-rust = { version = "0.8", features = ["xxh32"] }
